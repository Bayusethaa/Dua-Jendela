<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 Sejajar · Dua Jendela</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💛</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#14172b;--bg2:#1d2140;--glow:#f6c768;--rose:#ff8fa3;--ink:#f3ecdf;--mute:#a7a9c4;--ok:#7fd8a6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 20% 0,#262b57 0,var(--bg) 55%) fixed;color:var(--ink);font:400 17px/1.55 Nunito,system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 18px 64px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0}
h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;line-height:1.05}
h2{font-size:1.5rem;margin-bottom:8px}
a{color:var(--glow)}
.sub{color:var(--mute);margin:10px 0 22px}
.box{background:var(--bg2);border-radius:20px;padding:20px 16px;margin-bottom:16px}
.btn{background:var(--rose);color:#3a0d18;border:0;border-radius:12px;padding:12px 20px;font:700 16px Nunito,sans-serif;cursor:pointer;margin-top:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:2px solid #343968;background:var(--bg);color:var(--ink);font:inherit;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:stretch}
.row>*{flex:1}
.row .btn{margin-top:0;flex:0 0 auto}
.code{font:800 2.6rem/1 Fraunces,Georgia,serif;letter-spacing:.15em;color:var(--glow);margin:8px 0}
.note{color:var(--mute);font-size:14px}
#st{min-height:1.5em;color:var(--rose);font-weight:700;margin-top:12px}
.hide{display:none}
#msg{text-align:center;font-weight:700;min-height:1.6em;margin-bottom:10px}
#bd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#262b57;padding:8px;border-radius:16px}
#bd button{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;background:transparent;border:0;padding:0;cursor:pointer;border-radius:10px}
#bd button:hover:not(:disabled){background:#ffffff14}
.c{aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:clamp(1.2rem,6vw,2rem);overflow:hidden}
.c.w{background:#7fd8a644;box-shadow:0 0 0 3px var(--ok)}
.c.d{animation:drop .45s cubic-bezier(.5,0,.8,.6)}
@keyframes drop{from{transform:translateY(calc(-110% * (var(--r) + 1)))}}
@media(prefers-reduced-motion:reduce){.c.d{animation:none}}
</style>
</head>
<body>
<main>
<h1>4 Sejajar</h1>
<p class="sub">Jatuhkan hatimu, buat 4 sejajar lebih dulu dari pasanganmu. <a href="index.html">Kembali ke menu</a></p>

<div class="box" id="lobby">
<h2>Buat ruangan</h2>
<button class="btn" id="mk">Buat kode ruangan</button>
<div id="mine" class="hide"><div class="code" id="cd"></div><p class="note">Kirim kode ini ke pasanganmu, lalu tunggu dia masuk.</p></div>
<h2 style="margin-top:26px">Masuk ruangan</h2>
<div class="row">
<input type="text" id="jc" maxlength="5" placeholder="Kode 5 huruf" autocomplete="off" aria-label="Kode ruangan">
<button class="btn" id="jn">Masuk</button>
</div>
<div id="st" role="status"></div>
</div>

<div class="box hide" id="game">
<div id="msg"></div>
<div id="bd"></div>
<div style="text-align:center"><button class="btn" id="rs">Main lagi</button></div>
<p class="note" style="text-align:center;margin-top:12px">Kamu <b id="m1"></b>, pasanganmu <b id="m2"></b>. Ketuk kolom untuk menjatuhkan hati.</p>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
let peer,conn,me,tries=0;
const st=t=>$('#st').textContent=t;
const send=o=>{if(conn&&conn.open)conn.send(o)};
const rcode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>a[Math.random()*a.length|0]).join('')};
const R=6,C=7,E={X:'💛',O:'🌸'};
const mark=()=>me==='host'?'X':'O',opp=m=>m==='X'?'O':'X';
let bd,turn,over,starter='O',lastIdx=-1,win=[];

// ---- koneksi ----
function mkRoom(){
  if(peer)peer.destroy();
  const c=rcode();peer=new Peer('dj-4-'+c);
  peer.on('open',()=>{me='host';$('#cd').textContent=c;$('#mine').classList.remove('hide');st('')});
  peer.on('connection',cn=>{if(conn&&conn.open){cn.close();return}conn=cn;wire()});
  peer.on('error',e=>{if(e.type==='unavailable-id'&&tries++<5)mkRoom();else st('Gagal membuat ruangan ('+e.type+'). Coba lagi.')});
}
function joinRoom(){
  const c=$('#jc').value.trim().toUpperCase();
  if(c.length!==5){st('Masukkan kode 5 huruf.');return}
  st('Menghubungkan…');
  if(peer)peer.destroy();
  peer=new Peer();
  peer.on('open',()=>{me='guest';conn=peer.connect('dj-4-'+c,{reliable:true});wire()});
  peer.on('error',e=>st(e.type==='peer-unavailable'?'Kode tidak ditemukan. Cek lagi ya.':'Gagal terhubung ('+e.type+').'));
}
function wire(){
  conn.on('open',()=>{
    $('#lobby').classList.add('hide');$('#game').classList.remove('hide');
    $('#m1').textContent=E[mark()];$('#m2').textContent=E[opp(mark())];
    reset(false);
  });
  conn.on('data',onData);
  conn.on('close',()=>alert('Pasanganmu terputus. Muat ulang halaman untuk main lagi.'));
}
$('#mk').onclick=()=>{tries=0;mkRoom()};
$('#jn').onclick=joinRoom;
$('#jc').onkeydown=e=>{if(e.key==='Enter')joinRoom()};

// ---- papan ----
const board=$('#bd');
board.innerHTML=Array.from({length:C},(_,c)=>`<button data-c="${c}" aria-label="Kolom ${c+1}">${'<div class="c"></div>'.repeat(R)}</button>`).join('');
function render(){
  board.querySelectorAll('button').forEach((b,c)=>{
    b.disabled=over||turn!==mark();
    [...b.children].forEach((cell,r)=>{
      const i=r*C+c,v=bd[i];
      cell.textContent=v?E[v]:'';
      cell.className='c'+(win.includes(i)?' w':'');
      if(i===lastIdx&&v){cell.style.setProperty('--r',r);cell.classList.add('d')}
    });
  });
}
function msg(t){$('#msg').textContent=t||(turn===mark()?'Giliranmu':'Giliran pasanganmu')}
function reset(fromClick){
  starter=opp(starter);bd=Array(R*C).fill('');turn=starter;over=false;lastIdx=-1;win=[];
  render();msg();
  if(fromClick)send({t:'r'});
}
function findWin(i,m){
  const r0=(i/C)|0,c0=i%C;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    const line=[i];
    for(const s of [1,-1]){
      let r=r0+dr*s,c=c0+dc*s;
      while(r>=0&&r<R&&c>=0&&c<C&&bd[r*C+c]===m){line.push(r*C+c);r+=dr*s;c+=dc*s}
    }
    if(line.length>=4)return line;
  }
  return null;
}
function drop(c,m){
  if(over||c<0||c>=C)return false;
  for(let r=R-1;r>=0;r--){
    const i=r*C+c;
    if(!bd[i]){
      bd[i]=m;lastIdx=i;
      const w=findWin(i,m);
      if(w){over=true;win=w;render();msg(m===mark()?'Kamu menang! 🎉':'Pasanganmu menang!')}
      else if(bd.every(Boolean)){over=true;render();msg('Seri. Kalian sama kuat.')}
      else{turn=opp(m);render();msg()}
      return true;
    }
  }
  return false;
}
board.onclick=e=>{
  const b=e.target.closest('button');if(!b||over||turn!==mark())return;
  const c=+b.dataset.c;
  if(drop(c,mark()))send({t:'m',c});
};
$('#rs').onclick=()=>reset(true);
function onData(d){
  if(d.t==='m')drop(d.c,opp(mark()));
  else if(d.t==='r')reset(false);
}
</script>
</body>
</html>
